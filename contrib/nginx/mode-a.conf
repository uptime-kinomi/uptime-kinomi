# nginx, mode A (SPEC.md §9.1): nginx terminates TLS, uptime-kinomi serves
# everything (pages, Basic Auth for /private/, /push/, /metrics).
#
# kinomi.toml:  [server] listen = "127.0.0.1:8080"
#               hostnames = ["status.example.org"]
# Certificates: certbot certonly --webroot -w /var/www/html -d status.example.org

server {
    listen 80;
    listen [::]:80;
    server_name status.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.org;

    ssl_certificate     /etc/letsencrypt/live/status.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.org/privkey.pem;

    # kinomi never reads request bodies; nothing big needs to pass.
    client_max_body_size 4k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # kinomi checks the Host header against server.hostnames.
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Below a prefix instead (https://example.org/status/), use:
    # location /status/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header Host $host;
    # }
}
