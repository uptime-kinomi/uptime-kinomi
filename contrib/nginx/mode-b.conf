# nginx, mode B (SPEC.md §9.1): nginx serves the generated files itself and
# does the Basic Auth; only /push/ (and /metrics, if enabled) go to kinomi.
# Use this if you do not want to expose kinomi's own HTTP server.
#
# - Files: /run/uptime-kinomi/www (system unit) - add nginx's user to the
#   group "kinomi" so it can read them:  usermod -aG kinomi www-data
# - htpasswd: the same bcrypt file kinomi uses. nginx verifies bcrypt with
#   the system's crypt(3) (libxcrypt: Debian 11+, Ubuntu 22.04+, Raspberry
#   Pi OS bullseye+). It must be readable by nginx's user.
# - kinomi.toml: [server] listen = "127.0.0.1:8080" (for /push/), or
#   enabled = false if you have no push monitors and no /metrics.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.org;

    ssl_certificate     /etc/letsencrypt/live/status.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.org/privkey.pem;

    root /run/uptime-kinomi/www/public;
    index index.html;

    # The same headers kinomi's own server sends (SPEC.md §9.4).
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Your default page.
    location = / { return 302 /home/; }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    location /private/ {
        # "root", not "alias": /private/... maps to www/private/... exactly.
        root /run/uptime-kinomi/www;
        auth_basic "uptime-kinomi";
        auth_basic_user_file /etc/uptime-kinomi/htpasswd;
        add_header Cache-Control "private, no-store" always;
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    location /push/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Only with server.metrics = true (kinomi does the Basic Auth itself).
    location = /metrics {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
