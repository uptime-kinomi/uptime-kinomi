# The user kinomi runs as, as a systemd *user* service. Created if it does
# not exist (needs become). If it is not the Ansible login user, the role
# uses become for the files, user creation and lingering.
KINOMI_USER: kinomi

# The configuration directory (start from contrib/examples/config). Keep the
# trailing slash: the contents are copied, not the directory itself.
kinomi_config: "{{ playbook_dir }}/files/config/"

# Enable the weekly self-update timer (contrib/systemd/user/
# uptime-kinomi-update.timer). Only signed releases are installed; the
# configuration is checked with the new version before the restart.
# With false, the binary only changes with a manual
# "uptime-kinomi self-update".
kinomi_auto_update: true
