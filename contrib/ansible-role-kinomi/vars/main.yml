# Another user than the login user: files are copied with become and then
# owned by KINOMI_USER; commands run as KINOMI_USER.
kinomi_other_user: "{{ KINOMI_USER != ansible_facts['user_id'] }}"

# Modules run without temporary files, so become_user works without ACL
# tools (setfacl) on the target.
ansible_pipelining: true

# Release asset per CPU (`uname -m`), as in contrib/install.sh.
kinomi_assets:
  armv6l: armv6
  armv7l: armv7
  armv8l: armv7
  aarch64: aarch64
  x86_64: x86_64
  riscv64: riscv64
kinomi_asset: "uptime-kinomi-{{ kinomi_assets[ansible_facts['architecture']] }}"
kinomi_release_url: https://github.com/uptime-kinomi/uptime-kinomi/releases/latest/download

# Release signing keys (keys/ in the repository, SPEC.md §12.1).
