# Deploy uptime-kinomi (SPEC.md §10.5) for the login user as a systemd user
# service. No become anywhere. See ../README.md.

# Without lingering, the user service stops at the last logout and does not
# start at boot (SPEC.md §10.6).
- name: Lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
    creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"

- name: Wait for the user's systemd instance
  ansible.builtin.wait_for:
    path: "{{ kinomi_runtime_dir }}/bus"
    timeout: 60

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ kinomi_bin_dir }}"
    - "{{ kinomi_unit_dir }}"

# An existing binary is never touched: updates are the job of
# "uptime-kinomi self-update" (or the weekly timer below).
- name: Check for an installed binary
  ansible.builtin.stat:
    path: "{{ kinomi_bin_dir }}/uptime-kinomi"
  register: kinomi_installed

# The latest release for this CPU, verified like contrib/install.sh does:
# the minisign signature of SHA256SUMS, then the checksum of the binary.
- name: Install the latest release (only if not installed)
  when: not kinomi_installed.stat.exists
  block:
    - name: Download directory
      ansible.builtin.file:
        path: "{{ kinomi_download_dir }}"
        state: directory
        mode: "0700"

    - name: Download
      ansible.builtin.get_url:
        url: "{{ kinomi_release_url }}/{{ item }}"
        dest: "{{ kinomi_download_dir }}/"
        mode: "0644"
      loop:
        - SHA256SUMS
        - SHA256SUMS.minisig
        - "{{ kinomi_asset }}"

    - name: Verify signature and checksum (needs minisign)
      # As contrib/install.sh: a signature by one of the release keys, a
      # trusted comment "uptime-kinomi X.Y.Z", the checksum, and a test run
      # that reports exactly X.Y.Z (wrong CPU, old binary).
      ansible.builtin.shell:
        cmd: |
          set -eu
          ok=
          for key in {{ kinomi_release_keys | join(' ') }}; do
              if out=$(minisign -V -P "$key" -m SHA256SUMS 2>/dev/null); then ok=1; break; fi
          done
          [ -n "$ok" ] || { echo "SHA256SUMS is not signed by a release key" >&2; exit 1; }
          version=$(printf '%s\n' "$out" | sed -n 's/^Trusted comment: uptime-kinomi \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')
          [ -n "$version" ] || { echo "unexpected trusted comment" >&2; exit 1; }
          sha256sum --check --ignore-missing --strict SHA256SUMS
          chmod 755 {{ kinomi_asset }}
          ./{{ kinomi_asset }} version | grep -q "^uptime-kinomi $version (" ||
              { echo "the binary does not report version $version" >&2; exit 1; }
        chdir: "{{ kinomi_download_dir }}"
      changed_when: false

    - name: Binary
      ansible.builtin.copy:
        src: "{{ kinomi_download_dir }}/{{ kinomi_asset }}"
        dest: "{{ kinomi_bin_dir }}/uptime-kinomi"
        remote_src: true
        mode: "0755"
      notify: Restart uptime-kinomi

  always:
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ kinomi_download_dir }}"
        state: absent

# The configuration goes over as one archive (a directory copy is one
# transfer per file, which takes seconds each on a Pi 1). On the controller,
# ansible.builtin.copy first decrypts Ansible Vault files and follows
# symlinks. On the target, the user unpacks it into an empty staging
# directory, runs check-config there, and only then replaces the live
# directory, if something differs. The live directory then has exactly the
# files of kinomi_config: files removed or renamed there are gone too.
- name: Configuration
  block:
    - name: Configuration (temporary directory on the controller)
      delegate_to: localhost
      become: false
      ansible.builtin.tempfile:
        state: directory
        prefix: uptime-kinomi-config-
      register: kinomi_config_tmp
      changed_when: false

    - name: Configuration (decrypt Vault files, follow symlinks)
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        src: "{{ kinomi_config | regex_replace('/*$', '/') }}"
        dest: "{{ kinomi_config_tmp.path }}/config/"
        mode: "u=rwX,go="
      changed_when: false

    - name: Configuration (pack)
      delegate_to: localhost
      become: false
      # No ._* resource fork files from macOS tar.
      environment:
        COPYFILE_DISABLE: "1"
      ansible.builtin.command:
        cmd: "tar -C {{ kinomi_config_tmp.path }}/config -czf {{ kinomi_config_tmp.path }}/config.tgz ."
      changed_when: false

    - name: Configuration (upload directory on the target)
      ansible.builtin.tempfile:
        state: directory
        prefix: uptime-kinomi-config-
      register: kinomi_upload
      changed_when: false

    - name: Configuration (upload)
      ansible.builtin.copy:
        src: "{{ kinomi_config_tmp.path }}/config.tgz"
        dest: "{{ kinomi_upload.path }}/config.tgz"
        mode: "0600"
      changed_when: false

    # One step: fewer slow module starts on a Pi 1, and check-config sees the
    # final file modes.
    - name: Configuration (unpack, check, replace if it differs)
      ansible.builtin.shell:
        cmd: |
          set -eu
          live={{ kinomi_config_dir | quote }}
          new={{ kinomi_staging_dir | quote }}
          rm -rf "$new"
          mkdir -p -m 700 "$new"
          tar -xzf {{ kinomi_upload.path | quote }}/config.tgz -C "$new" --no-same-owner
          chmod -R u=rwX,go= "$new"
          if ! out=$({{ kinomi_bin_dir | quote }}/uptime-kinomi check-config --config-dir "$new" 2>&1); then
              printf '%s\n' "$out" >&2
              exit 1
          fi
          printf '%s\n' "$out"
          # Replacing the directory would delete data, logs or pages inside
          # it. check-config prints the directories (relative ones resolved
          # against the staging directory, absolute ones may point into the
          # live one); this works with every kinomi version.
          rnew=$(realpath -m -- "$new")
          rlive=$(realpath -m -- "$live")
          printf '%s\n' "$out" | sed -n 's/^\(data\|log\|output\) dir: *//p' |
              while IFS= read -r d; do
                  case "$(realpath -m -- "$d")/" in
                      "$rnew"/* | "$rlive"/* | "$rlive.new"/*)
                          echo "$d is inside the configuration directory: not replacing it" >&2
                          exit 1
                          ;;
                  esac
              done
          if [ -d "$live" ] && diff -r -q "$new" "$live" >/dev/null 2>&1; then
              echo unchanged
              exit 0
          fi
          rm -rf "$live.new"
          cp -a "$new" "$live.new"
          rm -rf "$live"
          mv "$live.new" "$live"
          echo replaced
      register: kinomi_config_replace
      changed_when: "kinomi_config_replace.stdout_lines[-1] == 'replaced'"
      notify: Restart uptime-kinomi

  always:
    - name: Configuration (remove the upload)
      ansible.builtin.file:
        path: "{{ kinomi_upload.path }}"
        state: absent
      when: kinomi_upload.path is defined
      changed_when: false

    - name: Configuration (remove the temporary directory on the controller)
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ kinomi_config_tmp.path }}"
        state: absent
      when: kinomi_config_tmp.path is defined
      changed_when: false

# The units shipped in contrib/systemd/user/, next to this role.
- name: User units
  ansible.builtin.copy:
    src: "{{ role_path }}/../systemd/user/{{ item }}"
    dest: "{{ kinomi_unit_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - uptime-kinomi.service
    - uptime-kinomi-update.service
    - uptime-kinomi-update.timer
  notify: Restart uptime-kinomi

- name: Enable the service
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi
    scope: user
    enabled: true
    state: started
    daemon_reload: true

- name: Weekly self-update timer
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi-update.timer
    scope: user
    enabled: "{{ kinomi_auto_update | bool }}"
    state: "{{ 'started' if kinomi_auto_update | bool else 'stopped' }}"
