# Deploy uptime-kinomi (SPEC.md §10.5) as root: packages, KINOMI_USER and
# lingering, then binary, configuration and systemd user service of that
# user. kinomi itself never runs as root. See ../README.md.

- name: Packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - minisign
    state: present
    cache_valid_time: 86400

- name: KINOMI_USER
  ansible.builtin.user:
    name: "{{ KINOMI_USER }}"
    shell: /bin/bash
    create_home: true
  register: kinomi_account

# Without lingering, the user service stops at the last logout and does not
# start at boot (SPEC.md §10.6).
- name: Lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ KINOMI_USER }}"
    creates: "/var/lib/systemd/linger/{{ KINOMI_USER }}"

- name: Wait for the user's systemd instance
  ansible.builtin.wait_for:
    path: "{{ kinomi_runtime_dir }}/bus"
    timeout: 60

# One by one, so that every new level belongs to KINOMI_USER. No mode:
# existing directories in the home keep theirs.
- name: Directories
  ansible.builtin.file:
    path: "{{ kinomi_home }}/{{ item }}"
    state: directory
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
  loop:
    - .local
    - .local/bin
    - .config
    - .config/systemd
    - .config/systemd/user
    - .cache

# An existing binary is never touched: updates are the job of
# "uptime-kinomi self-update" (or the weekly timer below).
- name: Check for an installed binary
  ansible.builtin.stat:
    path: "{{ kinomi_bin_dir }}/uptime-kinomi"
  register: kinomi_installed

# The latest release for this CPU, verified like contrib/install.sh does:
# the minisign signature of SHA256SUMS, then the checksum of the binary.
- name: Install the latest release (only if not installed)
  when: not kinomi_installed.stat.exists
  block:
    - name: Download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: uptime-kinomi-
      register: kinomi_download

    - name: Download
      ansible.builtin.get_url:
        url: "{{ kinomi_release_url }}/{{ item }}"
        dest: "{{ kinomi_download.path }}/"
        mode: "0644"
      loop:
        - SHA256SUMS
        - SHA256SUMS.minisig
        - "{{ kinomi_asset }}"

    - name: Verify signature and checksum
      # As contrib/install.sh: a signature by one of the release keys, a
      # trusted comment "uptime-kinomi X.Y.Z", the checksum, and a test run
      # that reports exactly X.Y.Z (wrong CPU, old binary).
      ansible.builtin.shell:
        cmd: |
          set -eu
          ok=
          for key in {{ kinomi_release_keys | join(' ') }}; do
              if out=$(minisign -V -P "$key" -m SHA256SUMS 2>/dev/null); then ok=1; break; fi
          done
          [ -n "$ok" ] || { echo "SHA256SUMS is not signed by a release key" >&2; exit 1; }
          version=$(printf '%s\n' "$out" | sed -n 's/^Trusted comment: uptime-kinomi \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')
          [ -n "$version" ] || { echo "unexpected trusted comment" >&2; exit 1; }
          sha256sum --check --ignore-missing --strict SHA256SUMS
          chmod 755 {{ kinomi_asset }}
          ./{{ kinomi_asset }} version | grep -q "^uptime-kinomi $version (" ||
              { echo "the binary does not report version $version" >&2; exit 1; }
        chdir: "{{ kinomi_download.path }}"
      changed_when: false

    - name: Binary
      ansible.builtin.copy:
        src: "{{ kinomi_download.path }}/{{ kinomi_asset }}"
        dest: "{{ kinomi_bin_dir }}/uptime-kinomi"
        remote_src: true
        owner: "{{ KINOMI_USER }}"
        group: "{{ kinomi_account.group }}"
        mode: "0755"
      notify: Restart uptime-kinomi

  always:
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ kinomi_download.path }}"
        state: absent
      when: kinomi_download.path is defined

# Validate the whole directory before it goes live: copy it to an empty
# staging directory, run check-config there, and only then update the real
# one. Both end up with exactly the files of kinomi_config: files that were
# removed or renamed there are removed on the target too (copy alone keeps
# them, and e.g. a renamed push monitor would then exist twice).
- name: Configuration (empty staging directory)
  ansible.builtin.file:
    path: "{{ kinomi_staging_dir }}"
    state: absent
  changed_when: false

- name: Configuration (staging)
  ansible.builtin.copy:
    src: "{{ kinomi_config }}"
    dest: "{{ kinomi_staging_dir }}/"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "u=rwX,g=,o="
  changed_when: false

- name: Check the configuration
  become: true
  become_user: "{{ KINOMI_USER }}"
  ansible.builtin.command:
    cmd: "{{ kinomi_bin_dir }}/uptime-kinomi check-config --config-dir {{ kinomi_staging_dir }}"
  changed_when: false

- name: Configuration
  ansible.builtin.copy:
    src: "{{ kinomi_config }}"
    dest: "{{ kinomi_config_dir }}/"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "u=rwX,g=,o="
  notify: Restart uptime-kinomi

- name: Configuration (files in the source)
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ kinomi_config | regex_replace('/+$', '') }}"
    recurse: true
    hidden: true
    file_type: any
  register: kinomi_config_source

- name: Configuration (files on the target)
  ansible.builtin.find:
    paths: "{{ kinomi_config_dir }}"
    recurse: true
    hidden: true
    file_type: any
  register: kinomi_config_target

- name: Configuration (remove what is no longer in the source)
  ansible.builtin.file:
    path: "{{ kinomi_config_dir }}/{{ item }}"
    state: absent
  loop: "{{ target | difference(source) | sort }}"
  vars:
    source: "{{ kinomi_config_source.files | map(attribute='path')
                | map('regex_replace', '^' ~ (kinomi_config | regex_replace('/+$', '') | regex_escape) ~ '/', '') | list }}"
    target: "{{ kinomi_config_target.files | map(attribute='path')
                | map('regex_replace', '^' ~ (kinomi_config_dir | regex_escape) ~ '/', '') | list }}"
  notify: Restart uptime-kinomi

# The units shipped in contrib/systemd/user/, next to this role.
- name: User units
  ansible.builtin.copy:
    src: "{{ role_path }}/../systemd/user/{{ item }}"
    dest: "{{ kinomi_unit_dir }}/{{ item }}"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "0644"
  loop:
    - uptime-kinomi.service
    - uptime-kinomi-update.service
    - uptime-kinomi-update.timer
  notify: Restart uptime-kinomi

- name: Enable the service
  become: true
  become_user: "{{ KINOMI_USER }}"
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi
    scope: user
    enabled: true
    state: started
    daemon_reload: true

- name: Weekly self-update timer
  become: true
  become_user: "{{ KINOMI_USER }}"
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi-update.timer
    scope: user
    enabled: "{{ kinomi_auto_update | bool }}"
    state: "{{ 'started' if kinomi_auto_update | bool else 'stopped' }}"
