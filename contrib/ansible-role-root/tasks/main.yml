# Deploy uptime-kinomi (SPEC.md §10.5) as root: packages, KINOMI_USER and
# lingering, then binary, configuration and systemd user service of that
# user. kinomi itself never runs as root. See ../README.md.

- name: Packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - minisign
    state: present
    cache_valid_time: 86400

- name: KINOMI_USER
  ansible.builtin.user:
    name: "{{ KINOMI_USER }}"
    shell: /bin/bash
    create_home: true
  register: kinomi_account

# Without lingering, the user service stops at the last logout and does not
# start at boot (SPEC.md §10.6).
- name: Lingering
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ KINOMI_USER }}"
    creates: "/var/lib/systemd/linger/{{ KINOMI_USER }}"

- name: Wait for the user's systemd instance
  ansible.builtin.wait_for:
    path: "{{ kinomi_runtime_dir }}/bus"
    timeout: 60

# One by one, so that every new level belongs to KINOMI_USER. No mode:
# existing directories in the home keep theirs.
- name: Directories
  ansible.builtin.file:
    path: "{{ kinomi_home }}/{{ item }}"
    state: directory
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
  loop:
    - .local
    - .local/bin
    - .config
    - .config/systemd
    - .config/systemd/user
    - .cache

# An existing binary is never touched: updates are the job of
# "uptime-kinomi self-update" (or the weekly timer below).
- name: Check for an installed binary
  ansible.builtin.stat:
    path: "{{ kinomi_bin_dir }}/uptime-kinomi"
  register: kinomi_installed

# The latest release for this CPU, verified like contrib/install.sh does:
# the minisign signature of SHA256SUMS, then the checksum of the binary.
- name: Install the latest release (only if not installed)
  when: not kinomi_installed.stat.exists
  block:
    - name: Download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: uptime-kinomi-
      register: kinomi_download

    - name: Download
      ansible.builtin.get_url:
        url: "{{ kinomi_release_url }}/{{ item }}"
        dest: "{{ kinomi_download.path }}/"
        mode: "0644"
      loop:
        - SHA256SUMS
        - SHA256SUMS.minisig
        - "{{ kinomi_asset }}"

    - name: Verify signature and checksum
      ansible.builtin.shell:
        cmd: >-
          {% for key in kinomi_release_keys %}minisign -Vq -P {{ key }} -m SHA256SUMS ||
          {% endfor %}exit 1;
          sha256sum --check --ignore-missing --strict SHA256SUMS
        chdir: "{{ kinomi_download.path }}"
      changed_when: false

    - name: Binary
      ansible.builtin.copy:
        src: "{{ kinomi_download.path }}/{{ kinomi_asset }}"
        dest: "{{ kinomi_bin_dir }}/uptime-kinomi"
        remote_src: true
        owner: "{{ KINOMI_USER }}"
        group: "{{ kinomi_account.group }}"
        mode: "0755"
      notify: Restart uptime-kinomi

  always:
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ kinomi_download.path }}"
        state: absent
      when: kinomi_download.path is defined

# Validate the whole directory before it goes live: copy it to a staging
# directory, run check-config there, and only then replace the real one.
- name: Configuration (staging)
  ansible.builtin.copy:
    src: "{{ kinomi_config }}"
    dest: "{{ kinomi_staging_dir }}/"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "u=rwX,g=,o="

- name: Check the configuration
  become: true
  become_user: "{{ KINOMI_USER }}"
  ansible.builtin.command:
    cmd: "{{ kinomi_bin_dir }}/uptime-kinomi check-config --config-dir {{ kinomi_staging_dir }}"
  changed_when: false

- name: Configuration
  ansible.builtin.copy:
    src: "{{ kinomi_config }}"
    dest: "{{ kinomi_config_dir }}/"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "u=rwX,g=,o="
  notify: Restart uptime-kinomi

# The units shipped in contrib/systemd/user/, next to this role.
- name: User units
  ansible.builtin.copy:
    src: "{{ role_path }}/../systemd/user/{{ item }}"
    dest: "{{ kinomi_unit_dir }}/{{ item }}"
    owner: "{{ KINOMI_USER }}"
    group: "{{ kinomi_account.group }}"
    mode: "0644"
  loop:
    - uptime-kinomi.service
    - uptime-kinomi-update.service
    - uptime-kinomi-update.timer
  notify: Restart uptime-kinomi

- name: Enable the service
  become: true
  become_user: "{{ KINOMI_USER }}"
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi
    scope: user
    enabled: true
    state: started
    daemon_reload: true

- name: Weekly self-update timer
  become: true
  become_user: "{{ KINOMI_USER }}"
  environment:
    XDG_RUNTIME_DIR: "{{ kinomi_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: uptime-kinomi-update.timer
    scope: user
    enabled: "{{ kinomi_auto_update | bool }}"
    state: "{{ 'started' if kinomi_auto_update | bool else 'stopped' }}"
