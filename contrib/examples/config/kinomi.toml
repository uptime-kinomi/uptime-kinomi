# Example configuration for uptime-kinomi (SPEC.md §3). Copy this directory
# to ~/.config/uptime-kinomi/ (user) or /etc/uptime-kinomi/ (system) and adapt it.
# Check it with: uptime-kinomi check-config --config-dir <dir>
config_version = 1

[server]
listen = "127.0.0.1:8080"                 # behind nginx/Apache, see contrib/
hostnames = ["status.example.org", "localhost"]
base_url = "https://status.example.org"
htpasswd_file = "htpasswd"                # for the private page; relative to this directory

[pages]
timezone = "Europe/Berlin"
default_page = "home"

[defaults]
interval = "60s"
timeout = "10s"
retries = 1
notifications = ["phone"]
