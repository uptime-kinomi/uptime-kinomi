# Apache, mode B (SPEC.md §9.1): Apache serves the generated files and does
# the Basic Auth (with the same bcrypt htpasswd file); only /push/ (and
# /metrics) go to kinomi. Needs: a2enmod ssl proxy proxy_http headers
#
# Apache's user must be able to read /run/uptime-kinomi/www (group "kinomi")
# and /etc/uptime-kinomi/htpasswd.

<VirtualHost *:443>
    ServerName status.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/status.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/status.example.org/privkey.pem

    DocumentRoot /run/uptime-kinomi/www/public
    DirectoryIndex index.html

    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    Header always set X-Frame-Options DENY

    # Your default page.
    RedirectMatch 302 ^/$ /home/

    <Directory /run/uptime-kinomi/www/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /private/ /run/uptime-kinomi/www/private/
    <Directory /run/uptime-kinomi/www/private>
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "uptime-kinomi"
        AuthUserFile /etc/uptime-kinomi/htpasswd
        Require valid-user
        Header always set Cache-Control "private, no-store"
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /push/  http://127.0.0.1:8080/push/
    ProxyPass        /metrics http://127.0.0.1:8080/metrics
    <Location /push/>
        LimitRequestBody 4096
    </Location>
</VirtualHost>
