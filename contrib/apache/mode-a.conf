# Apache, mode A (SPEC.md §9.1): Apache terminates TLS, uptime-kinomi serves
# everything. Needs: a2enmod ssl proxy proxy_http headers
#
# kinomi.toml:  [server] listen = "127.0.0.1:8080"
#               hostnames = ["status.example.org"]

<VirtualHost *:443>
    ServerName status.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/status.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/status.example.org/privkey.pem

    # kinomi never reads request bodies.
    LimitRequestBody 4096

    ProxyRequests Off
    # kinomi checks the Host header against server.hostnames.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
