name: Build

# Reusable workflow: static binaries for all release targets, tested under
# QEMU. Used by ci.yml (every push) and release.yml (tags).

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cross from git: the 0.2.5 release has no riscv64gc-unknown-linux-musl image.
  CROSS_REV: 526d03ddcd2f70e683074b3ea6f75ed300f33132

jobs:
  build:
    name: build ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # cpu: the oldest CPU we promise to support for this binary.
          # cflags: for C code in dependencies (ring). The cross gcc for
          # arm-unknown-linux-musleabihf defaults to ARMv7, which would crash
          # a Raspberry Pi 1.
          - { target: arm-unknown-linux-musleabihf, suffix: armv6, qemu: qemu-arm, cpu: arm1176, cflags: "-march=armv6 -mfpu=vfp -mfloat-abi=hard" }
          - { target: armv7-unknown-linux-musleabihf, suffix: armv7, qemu: qemu-arm, cpu: cortex-a7, cflags: "" }
          - { target: aarch64-unknown-linux-musl, suffix: aarch64, qemu: qemu-aarch64, cpu: cortex-a53, cflags: "" }
          - { target: x86_64-unknown-linux-musl, suffix: x86_64, qemu: "", cpu: "", cflags: "" }
          - { target: riscv64gc-unknown-linux-musl, suffix: riscv64, qemu: qemu-riscv64, cpu: rv64, cflags: "" }
    env:
      TARGET_CFLAGS: ${{ matrix.cflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache cross
        id: cache-cross
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_REV }}
      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
      - name: Install QEMU
        if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build
        run: cross build --locked --release --target ${{ matrix.target }}
      # The test binary is run with the runner's QEMU and an explicit CPU,
      # so instructions newer than that CPU fail the tests.
      - name: Test (under QEMU for foreign targets)
        run: |
          if [ -z "${{ matrix.qemu }}" ]; then
            cross test --locked --target ${{ matrix.target }}
            exit 0
          fi
          cross test --locked --target ${{ matrix.target }} --no-run
          tests=$(find target/${{ matrix.target }}/debug/deps -maxdepth 1 -type f -executable -name 'uptime_kinomi-*')
          [ -n "$tests" ] || { echo "::error::no test binary found"; exit 1; }
          for t in $tests; do
            ${{ matrix.qemu }} -cpu ${{ matrix.cpu }} "$t"
          done
      # Informational: ring contains optional ARMv7/NEON assembly that is
      # only used after runtime CPU detection, so the binary is tagged v7.
      # The real check is running tests and a TLS handshake on the emulated
      # oldest CPU (tests above, smoke test below).
      - name: Show ELF attributes
        if: matrix.qemu == 'qemu-arm'
        run: readelf -A target/${{ matrix.target }}/release/uptime-kinomi
      - name: Smoke test (including a TLS handshake with github.com)
        env:
          KINOMI_SMOKE_NETWORK: "1"
        run: |
          bin=target/${{ matrix.target }}/release/uptime-kinomi
          if [ -n "${{ matrix.qemu }}" ]; then
            sh ci/smoke-test.sh "$bin" ${{ matrix.qemu }} -cpu ${{ matrix.cpu }}
          else
            sh ci/smoke-test.sh "$bin"
          fi
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/uptime-kinomi uptime-kinomi-${{ matrix.suffix }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uptime-kinomi-${{ matrix.suffix }}
          path: uptime-kinomi-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 14
