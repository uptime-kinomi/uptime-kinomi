[package]
name = "uptime-kinomi"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "SBC-friendly uptime monitor and static status pages. Runs on a Raspberry Pi 1."
license = "MIT"
repository = "https://github.com/uptime-kinomi/uptime-kinomi"
readme = "README.md"
keywords = ["uptime", "monitoring", "status-page", "raspberry-pi", "sbc"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# See AGENTS.md "Dependency policy" before adding any dependency.
# Release signature verification for self-update (no dependencies).
minisign-verify = "0.3"
# SHA-256 for self-update. Already in the tree through rustls, so no extra crate.
ring = { version = "0.17", default-features = false }
# Outbound HTTPS: rustls + ring + bundled Mozilla root certificates, no gzip.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Direct use only for error classification and certificate checks; already
# in the tree through ureq (same version, ring provider, no aws-lc).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# SIGTERM/SIGINT: flush the log before exiting (safe API, flag only).
signal-hook = { version = "0.4", default-features = false }
# Mozilla CA roots for the certificate expiry check (already used by ureq).
webpki-roots = "1"
# Time zones for status pages, from the system tz database only.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# bcrypt core for htpasswd (format handling is ours: no alloc, no 2nd getrandom).
bcrypt = { version = "0.19", default-features = false }
# Inbound HTTP request parsing for the built-in server.
httparse = { version = "1", default-features = false, features = ["std"] }
# Configuration files (parsing only, no TOML writer).
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
