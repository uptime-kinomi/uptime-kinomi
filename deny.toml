# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[graph]
targets = [
    "arm-unknown-linux-musleabihf",
    "armv7-unknown-linux-musleabihf",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "riscv64gc-unknown-linux-musl",
]

[advisories]
# Security advisories and unmaintained crates are errors.
yanked = "deny"

[licenses]
# Permissive licenses compatible with MIT distribution only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is a policy, not a list of currently used licenses.
unused-allowed-license = "allow"

# The Mozilla CA root list is data under a permissive data license.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No async runtimes (AGENTS.md, dependency policy).
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
